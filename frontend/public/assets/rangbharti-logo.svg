<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5500"/>
      <stop offset="50%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff7700" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Orange Scallop / Shield Border -->
  <path d="M 100,6 C 135,6 185,15 190,55 C 195,95 192,145 160,175 C 135,195 100,198 100,198 C 100,198 65,195 40,175 C 8,145 5,95 10,55 C 15,15 65,6 100,6 Z" 
        fill="url(#badgeGrad)" stroke="url(#orangeGlow)" stroke-width="4" filter="url(#glow)"/>

  <!-- Inner thin orange border -->
  <path d="M 100,14 C 130,14 175,22 180,58 C 185,94 182,138 153,166 C 130,184 100,188 100,188 C 100,188 70,184 47,166 C 18,138 15,94 20,58 C 25,22 70,14 100,14 Z" 
        fill="none" stroke="#ff7700" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- RangBharti's text -->
  <text x="100" y="44" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">RangBharti's</text>

  <!-- Sacred Flame / Rangbharti geometric motif -->
  <g transform="translate(100, 75) scale(0.85)">
    <!-- Flag / Torch / Lattice -->
    <path d="M 0,-24 C 6,-18 10,-10 0,0 C -10,-10 -6,-18 0,-24 Z" fill="#ff7700"/>
    <path d="M 0,-18 C 3,-14 6,-8 0,0 C -6,-8 -3,-14 0,-18 Z" fill="#ffcc00"/>
    <!-- Triangular lattice pattern -->
    <polygon points="0,-2 -16,10 16,10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <polygon points="0,4 -22,18 22,18" fill="none" stroke="#ffffff" stroke-width="2"/>
    <polygon points="0,10 -28,26 28,26" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- Flag on top -->
    <polygon points="3,-22 14,-26 3,-30" fill="#ff7700"/>
    <line x1="3" y1="-32" x2="3" y2="-18" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- SHANTI GURUKUL in bold orange / saffron -->
  <text x="100" y="132" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="17" font-weight="900" fill="#ff8c00" letter-spacing="1">SHANTI</text>
  <text x="100" y="152" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="17" font-weight="900" fill="#ff8c00" letter-spacing="1">GURUKUL</text>

  <!-- Location details -->
  <text x="100" y="168" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">BACHANI TAL. KAGAL,</text>
  <text x="100" y="179" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">DIST. KOLHAPUR</text>
</svg>
